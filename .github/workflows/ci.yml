name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # `edited` too: the title of a pull request becomes its squashed commit and the body stays public
    # beside it, so the message gate reads both again whenever they change. No `concurrency` here:
    # branch protection takes the run of the latest event, and cancelling one can leave it blocked.
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    continue-on-error: ${{ matrix.php == '8.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      # The family's one copy of this gate lives in getmilpa/devtools. It reads this pull request's
      # title, body and commits (or the commits a push added) and needs nothing from the checkout.
      - name: Message gate (a commit speaks for its author alone)
        uses: getmilpa/devtools/.github/actions/message-gate@main

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: License gate (runtime deps must be MIT / BSD / Apache-2.0 / ISC)
        run: |
          composer licenses --no-dev --format=json | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[];$allow="~^(MIT|BSD-[0-9].*|Apache-2\\.0|ISC)$~";$bad=[];foreach(($d["dependencies"]??[]) as $n=>$i){$ls=(array)($i["license"]??[]);if($ls===[]){$bad[]="$n: (none declared)";continue;}$ok=false;foreach($ls as $l){if(preg_match($allow,(string)$l)){$ok=true;break;}}if(!$ok)$bad[]="$n: ".implode(" OR ",$ls);}if($bad){fwrite(STDERR,"Disallowed dependency licenses (only MIT/BSD/Apache-2.0/ISC allowed):\n- ".implode("\n- ",$bad)."\n");exit(1);}echo "license gate ok: ".count($d["dependencies"]??[])." runtime deps, each offered under MIT/BSD/Apache-2.0/ISC\n";'

      - name: PHP syntax
        run: find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Code style (family standard, php-cs-fixer dry-run)
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse src --no-progress

      - name: PHPUnit + coverage floor
        env:
          XDEBUG_MODE: coverage
        run: |
          vendor/bin/phpunit --testsuite Agent --coverage-clover=build/clover.xml
          php tools/coverage-floor.php build/clover.xml 95

      - name: DocBlock coverage gate
        run: php tools/validate-docblocks.php

      - name: Attribution gate
        run: php tools/verify-attribution.php
